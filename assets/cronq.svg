<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Outer Glow Shadow -->
  <rect x="26" y="10" width="76" height="108" rx="22" fill="#818cf8" opacity="0.25" filter="url(#glow)"/>
  <!-- Phone Outer Frame -->
  <rect x="26" y="10" width="76" height="108" rx="22" fill="#18181b" stroke="url(#borderGrad)" stroke-width="2.5"/>
  <!-- Screen Area -->
  <rect x="31" y="16" width="66" height="96" rx="17" fill="url(#screenGrad)"/>
  <!-- Top Status / Notch Pill -->
  <rect x="49" y="21" width="30" height="5" rx="2.5" fill="#27272a"/>
  <circle cx="53" cy="23.5" r="1.2" fill="#38bdf8"/>
  <rect x="58" y="22.5" width="16" height="2" rx="1" fill="#71717a"/>
  <!-- Search Capsule -->
  <rect x="36" y="32" width="56" height="12" rx="6" fill="#141417" stroke="#27272a" stroke-width="1"/>
  <circle cx="43" cy="38" r="2.5" fill="none" stroke="#71717a" stroke-width="0.8"/>
  <line x1="45" y1="40" x2="47" y2="42" stroke="#71717a" stroke-width="0.8"/>
  <rect x="50" y="37" width="28" height="2" rx="1" fill="#52525b"/>
  <!-- App Icons Grid (2 circles with glyphs) -->
  <rect x="38" y="52" width="22" height="22" rx="6" fill="#121215" stroke="#27272a" stroke-width="1"/>
  <circle cx="49" cy="63" r="5" fill="#38bdf8" opacity="0.9"/>
  <rect x="68" y="52" width="22" height="22" rx="6" fill="#121215" stroke="#27272a" stroke-width="1"/>
  <circle cx="79" cy="63" r="5" fill="#c084fc" opacity="0.9"/>
  <!-- Bottom Feature Bar -->
  <rect x="31" y="88" width="66" height="16" fill="#121215"/>
  <circle cx="42" cy="96" r="2" fill="#71717a"/>
  <circle cx="54" cy="96" r="2" fill="#71717a"/>
  <circle cx="64" cy="96" r="2" fill="#38bdf8"/>
  <circle cx="74" cy="96" r="2" fill="#71717a"/>
  <circle cx="86" cy="96" r="2" fill="#71717a"/>
  <!-- Bottom Home Pill -->
  <rect x="50" y="106" width="28" height="2.5" rx="1.25" fill="#52525b"/>
</svg>
